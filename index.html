<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FOX Coin Game - Ultimate Edition</title>
    
    <meta name="monetag" content="b1dd2a8a65cff59345c720f45de9d863">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(rgba(11, 15, 25, 0.85), rgba(11, 15, 25, 0.85)), url('background.jpg');
            background-size: cover;
            background-position: center;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 800px;
            background-color: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            gap: 8px;
            z-index: 10;
        }

        .coin-balance {
            background-color: rgba(20, 25, 35, 0.9);
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 6px 12px;
            font-size: 14px;
            color: #d4af37;
            font-weight: bold;
        }

        .user-level {
            background-color: rgba(20, 25, 35, 0.9);
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 5px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            width: 100%;
        }

        .screen.active {
            display: flex;
        }

        .main-content {
            justify-content: center;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        .big-coin-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, #222 30%, #000 90%);
            border: 4px solid #d4af37;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
            transition: transform 0.05s ease;
            overflow: hidden;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .big-coin-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .big-coin-btn:active {
            transform: scale(0.93);
        }

        .floating-score {
            position: absolute;
            color: #d4af37;
            font-weight: bold;
            font-size: 18px;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
            background: rgba(11, 15, 25, 0.9);
            border: 2px solid #d4af37;
            padding: 4px 10px;
            border-radius: 10px;
            z-index: 100;
            direction: ltr;
            white-space: nowrap;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.1); }
        }

        .info-card {
            background-color: rgba(18, 22, 33, 0.85);
            border: 1px solid #2a3447;
            border-radius: 15px;
            width: 100%;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            direction: rtl;
        }

        .action-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            outline: none;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .shop-section {
            background-color: rgba(18, 22, 33, 0.95);
            border: 1px solid #2a3447;
            border-radius: 15px;
            width: 100%;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        /* ستایلێن یارییا چیچکی (Catch the Chick Game) */
        .game-canvas-container {
            width: 100%;
            height: 380px;
            background: radial-gradient(circle, #1a2536 0%, #0b0f19 100%);
            border: 2px solid #d4af37;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        /* بەشێ ڕیگلاما ل خوارێ بەرێخودانا لژنا خوارێ (Banner Ad Container) */
        .banner-ad-bar {
            width: 100%;
            background-color: #0b0f19;
            border-top: 1px solid #2a3447;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 50px;
            padding: 4px;
            overflow: hidden;
        }

        .nav-bar {
            display: flex;
            justify-content: space-around;
            background-color: #121621;
            padding: 8px 0;
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #8b9bb4;
            font-size: 11px;
            text-decoration: none;
            gap: 3px;
            cursor: pointer;
            flex: 1;
            outline: none;
            background: none;
            border: none;
        }
        .nav-item.active { color: #d4af37; }
        .nav-item span.icon { font-size: 16px; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-content {
            background: #121621;
            border: 2px solid #2481cc;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- سەرێ یاریێ -->
        <div class="header">
            <div class="coin-balance">
                🟡 <span id="score">1.00000</span>
            </div>
            <div class="user-level">
                <div style="text-align: right;">
                    <div style="font-size: 11px; font-weight: bold;" id="userNameText">FOX Player</div>
                    <div style="font-size: 9px; color: #d4af37;" id="levelText">Lvl 1</div>
                </div>
                <div id="userAvatarHeader" style="width: 26px; height: 26px; border-radius: 50%; overflow: hidden; border: 1px solid #d4af37; background: #222; display: flex; justify-content: center; align-items: center;">
                    <span id="fallbackAvatarHeader" style="font-size: 12px;">⚽</span>
                </div>
            </div>
        </div>

        <!-- 1. پەڕەیا تاپ (Tap) -->
        <div id="tapScreen" class="screen main-content active">
            <div class="big-coin-btn" id="tapBtn">
                <img src="coin.jpg" alt="Coin" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'><circle cx=\'50\' cy=\'50\' r=\'45\' fill=\'%23ffd700\'/></svg>';">
            </div>

            <div class="info-card">
                <div class="info-row">
                    <span>پەکێت 📦</span>
                    <span id="packetText" style="font-weight: bold; direction: ltr;">4 / 5</span>
                </div>
                <div class="info-row" style="color: #8b9bb4; font-size: 11px;">
                    <span>پەکیتا داهاتی</span>
                    <span id="timerText" style="direction: ltr;">02:00:00</span>
                </div>
                <hr style="border: 0; border-top: 1px solid #2a3447;">
                <div class="info-row">
                    <span>ئینرجی ⚡</span>
                    <span style="font-weight: bold; direction: ltr;" id="energyText">500 / 500</span>
                </div>
                <button class="action-btn" id="useEnergyBtn" onclick="usePacket()">بکاربینە (Use) ⚡</button>
            </div>
        </div>

        <!-- 2. پەڕەیا شوپ (دووکان) -->
        <div id="shopScreen" class="screen" style="flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; padding-top: 10px;">
            <h3 style="color: #d4af37; margin-bottom: 2px;">🛒 دووکان و تەلەبی</h3>
            <div class="shop-section">
                <h4 style="font-size: 14px; color: #fff;">بەرفرهکرنا ئینرجییێ ⚡ (+500 کاپاسیتى)</h4>
                <p style="font-size: 11px; color: #d4af37; font-weight: bold;">بهایێ: <span id="energyUpgradeCost">0.50000</span> FOX</p>
                <button onclick="upgradeEnergyCapacity()" style="background-color: #3498db; color: white; border: none; border-radius: 8px; padding: 8px; font-size: 13px; font-weight: bold; cursor: pointer; width: 100%;">پێشڤەبرن (Upgrade)</button>
            </div>
        </div>

        <!-- 3. پەڕەیا ئەرکان (Tasks) - یارییا چیچک و عەمودێ -->
        <div id="tasksScreen" class="screen" style="gap: 8px; align-items: center; justify-content: flex-start; padding-top: 5px;">
            <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                <h3 style="color: #d4af37; font-size: 15px;">🐥 یارییا گرتنا چیچکی</h3>
                <div style="font-size: 12px; color: #2ecc71; font-weight: bold;">خاڵ: <span id="gameScore">0</span></div>
            </div>

            <!-- کەنڤاسێ یاریێ (Game Canvas) -->
            <div class="game-canvas-container" id="gameContainerDiv">
                <canvas id="chickGameCanvas" width="370" height="370"></canvas>
            </div>

            <button id="startGameBtn" onclick="toggleGame()" class="action-btn" style="width: 100%; padding: 8px; font-size: 14px; background-color: #f39c12;">دەستپێکرنا یاریێ 🎮</button>
        </div>

        <!-- لژنا خوارێ و بەشێ ڕیگلاما Banner Ad -->
        <div>
            <!-- بەشێ ڕیگلاما مۆنێتاگ (Banner Ad Container) -->
            <div class="banner-ad-bar">
                <script src="https://3nbf4.com/pfp.js?zoneid=11731281" async></script>
            </div>

            <div class="nav-bar" id="navBar">
                <button onclick="switchTab('tasksScreen', event)" class="nav-item" id="navTasks">
                    <span class="icon">🐥</span>
                    <span>Tasks/Game</span>
                </button>
                <button onclick="switchTab('shopScreen', event)" class="nav-item" id="navShop">
                    <span class="icon">🛒</span>
                    <span>Shop</span>
                </button>
                <button onclick="switchTab('tapScreen', event)" class="nav-item active" id="navTap">
                    <span class="icon">👆</span>
                    <span>Tap</span>
                </button>
            </div>
        </div>
    </div>

    <!-- پۆداڵ بۆ ڕاگەهاندنان -->
    <div id="customModal" class="modal">
        <div class="modal-content" style="border-color: #d4af37;">
            <h3 id="modalTitle" style="color: #d4af37;">پەیام</h3>
            <p id="modalMessage" style="font-size: 13px; color: #b0c4de;"></p>
            <button onclick="closeModal()" style="background-color: #d4af37; color: #0b0f19; border: none; border-radius: 8px; padding: 8px; font-weight: bold; cursor: pointer;">باشە (OK)</button>
        </div>
    </div>

    <script>
        // تۆمارکرنا Service Worker بۆ مۆنێتاگ
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('Service Worker Registered!', reg))
            .catch(err => console.log('Service Worker Registration Failed!', err));
        }

        const BOT_TOKEN = "8945123640:AAGjazTZFPNmjHDAw5LdwYTB9tWjQFVooXs";
        const ADMIN_ID = 8920889734;

        window.Telegram.WebApp.ready();
        const tg = window.Telegram.WebApp;
        tg.expand();

        let telegramUser = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;
        let telegramUserId = telegramUser && telegramUser.id ? telegramUser.id : ADMIN_ID;
        let telegramName = telegramUser && telegramUser.first_name ? telegramUser.first_name : 'FOX Player';
        let telegramPhotoUrl = telegramUser && telegramUser.photo_url ? telegramUser.photo_url : null;

        document.getElementById('userNameText').innerText = telegramName;
        if (telegramPhotoUrl) {
            document.getElementById('userAvatarHeader').innerHTML = `<img src="${telegramPhotoUrl}" alt="Profile" style="width: 100%; height: 100%; object-fit: cover;">`;
        }

        const REAL_PREFIX = 'fox_ultimate_storage_v19_' + telegramUserId + '_';

        function getStoredData(key, defaultValue) {
            let val = localStorage.getItem(REAL_PREFIX + key);
            if (val !== null) return val;
            return defaultValue;
        }

        let savedCoins = getStoredData('coins', null);
        let coins = savedCoins !== null ? parseFloat(savedCoins) : 1.00000;

        let maxEnergy = parseInt(getStoredData('max_energy', '500'));
        let energy = parseInt(getStoredData('energy', maxEnergy));
        let level = parseInt(getStoredData('level', '1'));
        let totalTaps = parseInt(getStoredData('total_taps', '0'));
        let packets = parseInt(getStoredData('packets', '4'));
        let totalSeconds = parseInt(getStoredData('timer', (2 * 3600)));
        let isTimerRunning = false;
        
        let isSubscribed = getStoredData('is_subscribed', 'false') === 'true';

        const scoreElement = document.getElementById('score');
        const levelText = document.getElementById('levelText');
        const tapBtn = document.getElementById('tapBtn');
        const energyText = document.getElementById('energyText');
        const timerText = document.getElementById('timerText');
        const packetText = document.getElementById('packetText');

        scoreElement.innerText = coins.toFixed(5);
        levelText.innerText = "Lvl " + level;
        energyText.innerText = energy + " / " + maxEnergy;
        packetText.innerText = packets + " / 5";

        function showModal(title, msg) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = msg;
            document.getElementById('customModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('customModal').style.display = 'none';
        }

        function upgradeEnergyCapacity() {
            let upgradeCost = 0.50000;
            if (coins >= upgradeCost) {
                coins -= upgradeCost;
                maxEnergy += 500;
                energy = maxEnergy;
                scoreElement.innerText = coins.toFixed(5);
                energyText.innerText = energy + " / " + maxEnergy;

                localStorage.setItem(REAL_PREFIX + 'coins', coins);
                localStorage.setItem(REAL_PREFIX + 'max_energy', maxEnergy);
                localStorage.setItem(REAL_PREFIX + 'energy', energy);

                showModal('پێشڤەبرن ⚡', 'کاپاسیتیا ئینرجییێ بوو ب ' + maxEnergy + '!');
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                showModal('کێمیا کۆینان 🟡', 'پێدڤی ب 0.50000 FOX هەیە بۆ بلندکرنا ئینرجییێ.');
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }
        }

        function startTimer() {
            if (isTimerRunning) return;
            isTimerRunning = true;
            let timerInterval = setInterval(function() {
                if (totalSeconds > 0) {
                    totalSeconds--;
                    let hours = Math.floor(totalSeconds / 3600);
                    let minutes = Math.floor((totalSeconds % 3600) / 60);
                    let seconds = totalSeconds % 60;
                    timerText.innerText = String(hours).padStart(2, '0') + ":" + String(minutes).padStart(2, '0') + ":" + String(seconds).padStart(2, '0');
                    localStorage.setItem(REAL_PREFIX + 'timer', totalSeconds);
                } else {
                    packets = 5;
                    packetText.innerText = packets + " / 5";
                    localStorage.setItem(REAL_PREFIX + 'packets', packets);
                    localStorage.removeItem(REAL_PREFIX + 'timer');
                    isTimerRunning = false;
                    clearInterval(timerInterval);
                }
            }, 1000);
        }

        if (packets < 5) startTimer();

        function handleTapAction(e) {
            if (energy > 0) {
                energy -= 1;
                totalTaps += 1;

                let clickReward = isSubscribed ? 0.00002 : 0.00001;
                coins += clickReward;

                let newLevel = Math.floor(totalTaps / 1000) + 1;
                if (newLevel !== level) {
                    level = newLevel;
                    levelText.innerText = "Lvl " + level;
                    localStorage.setItem(REAL_PREFIX + 'level', level);
                }

                scoreElement.innerText = coins.toFixed(5);
                energyText.innerText = energy + " / " + maxEnergy;

                localStorage.setItem(REAL_PREFIX + 'coins', coins);
                localStorage.setItem(REAL_PREFIX + 'energy', energy);
                localStorage.setItem(REAL_PREFIX + 'total_taps', totalTaps);

                const rect = tapBtn.getBoundingClientRect();
                let clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : rect.left + rect.width / 2);
                let clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : rect.top + rect.height / 2);

                const x = clientX - rect.left;
                const y = clientY - rect.top;

                const floatingEl = document.createElement('div');
                floatingEl.className = 'floating-score';
                floatingEl.innerText = "+" + clickReward.toFixed(5);
                floatingEl.style.left = (x - 30) + 'px';
                floatingEl.style.top = (y - 20) + 'px';

                tapBtn.appendChild(floatingEl);
                setTimeout(() => floatingEl.remove(), 800);

                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            } else {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }
        }

        tapBtn.addEventListener('click', handleTapAction);
        tapBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            handleTapAction(e);
        }, { passive: false });

        function usePacket() {
            if (packets > 0) {
                packets -= 1;
                packetText.innerText = packets + " / 5";
                localStorage.setItem(REAL_PREFIX + 'packets', packets);

                energy = maxEnergy;
                energyText.innerText = energy + " / " + maxEnergy;
                localStorage.setItem(REAL_PREFIX + 'energy', energy);

                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                if (!isTimerRunning) {
                    totalSeconds = (2 * 3600);
                    startTimer();
                }
            } else {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }
        }

        function switchTab(screenId, event) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById(screenId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // --- کۆدێ یارییا چیچکی (Catch the Chick Game Logic) ---
        const canvas = document.getElementById('chickGameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameRunning = false;
        let gameScore = 0;
        
        // سەبەتە / عەمود یان مەسحکور ل بنێ ئەکرانێ
        let catcher = {
            x: canvas.width / 2 - 40,
            y: canvas.height - 30,
            width: 80,
            height: 16,
            speed: 8
        };

        // چیچک
        let chick = {
            x: Math.random() * (canvas.width - 30),
            y: 0,
            radius: 14,
            speed: 3
        };

        let leftPressed = false;
        let rightPressed = false;

        // کنترۆلا تەمسوککرنێ (Touch / Mouse / Keyboard)
        canvas.addEventListener('mousemove', (e) => {
            let rect = canvas.getBoundingClientRect();
            let mouseX = e.clientX - rect.left;
            catcher.x = mouseX - catcher.width / 2;
            if (catcher.x < 0) catcher.x = 0;
            if (catcher.x + catcher.width > canvas.width) catcher.x = canvas.width - catcher.width;
        });

        canvas.addEventListener('touchmove', (e) => {
            let rect = canvas.getBoundingClientRect();
            let touchX = e.touches[0].clientX - rect.left;
            catcher.x = touchX - catcher.width / 2;
            if (catcher.x < 0) catcher.x = 0;
            if (catcher.x + catcher.width > canvas.width) catcher.x = canvas.width - catcher.width;
            e.preventDefault();
        }, { passive: false });

        function toggleGame() {
            if (!gameRunning) {
                gameRunning = true;
                gameScore = 0;
                document.getElementById('gameScore').innerText = gameScore;
                document.getElementById('startGameBtn').innerText = "د وەستاندنێ دا... ⏸";
                document.getElementById('startGameBtn').style.backgroundColor = "#e74c3c";
                resetChick();
                loopGame();
            } else {
                gameRunning = false;
                document.getElementById('startGameBtn').innerText = "دەستپێکرنا یاریێ 🎮";
                document.getElementById('startGameBtn').style.backgroundColor = "#f39c12";
            }
        }

        function resetChick() {
            chick.x = Math.random() * (canvas.width - 40) + 20;
            chick.y = 0;
            chick.speed = 2.5 + Math.random() * 2; // لەزاتیا چیچکی ب سەر هەلیکەت
        }

        function updateGame() {
            if (!gameRunning) return;

            // جووگرافیا کەڤتنا چیچکی
            chick.y += chick.speed;

            // پێکڤەدانا چیچکی ب سەبەتێ/عەمودی ڤە
            if (
                chick.y + chick.radius >= catcher.y &&
                chick.x >= catcher.x &&
                chick.x <= catcher.x + catcher.width
            ) {
                gameScore += 1;
                document.getElementById('gameScore').innerText = gameScore;
                
                // زێدەکرنا کۆینان وەک خەلات بۆ یاریێ
                coins += 0.00005;
                scoreElement.innerText = coins.toFixed(5);
                localStorage.setItem(REAL_PREFIX + 'coins', coins);

                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                resetChick();
            }

            // ئەگەر چیچک کەفتە خارێ وبەر نەهات گرتن
            if (chick.y > canvas.height) {
                gameRunning = false;
                showModal('خلاس بوو! ❌', 'چیچک کەفتە خوارێ! خاڵێن تە: ' + gameScore);
                document.getElementById('startGameBtn').innerText = "دوبارە ل یاریێ بکە 🔄";
                document.getElementById('startGameBtn').style.backgroundColor = "#f39c12";
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // نیشاندانا عەمودا ڕاگرتنێ (Platform / Catcher)
            ctx.fillStyle = '#d4af37';
            ctx.shadowColor = '#d4af37';
            ctx.shadowBlur = 10;
            ctx.fillRect(catcher.x, catcher.y, catcher.width, catcher.height);
            ctx.shadowBlur = 0; // پاقژکرنا سایدی

            // نیشاندانا چیچکی (Chick Emoji یا ژۆر)
            ctx.font = '24px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🐥', chick.x, chick.y);
        }

        function loopGame() {
            if (!gameRunning) return;
            updateGame();
            drawGame();
            requestAnimationFrame(loopGame);
        }

        // کێکشانا ئێکەم جار
        drawGame();
    </script>
</body>
</html>
