<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOX Coin Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .game-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 800px;
            background-color: #0b0f19;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            border: 2px solid #222;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
        }

        .user-level {
            background-color: rgba(20, 25, 35, 0.9);
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .coin-balance {
            background-color: rgba(20, 25, 35, 0.9);
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 6px 12px;
            font-size: 14px;
            color: #d4af37;
            font-weight: bold;
        }

        /* بەشێن سکرینان (Screens) */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            width: 100%;
        }

        .screen.active {
            display: flex;
        }

        .main-content {
            justify-content: center;
            gap: 20px;
        }

        .big-coin-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, #222 30%, #000 90%);
            border: 4px solid #d4af37;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
            transition: transform 0.1s;
            user-select: none;
            overflow: hidden;
        }

        .big-coin-btn:active {
            transform: scale(0.95);
        }

        .info-card {
            background-color: rgba(18, 22, 33, 0.85);
            border: 1px solid #2a3447;
            border-radius: 15px;
            width: 100%;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .action-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        /* تەسکی چەناڵێ */
        .task-item {
            background-color: rgba(18, 22, 33, 0.9);
            border: 1px solid #2a3447;
            border-radius: 12px;
            width: 100%;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .task-info h4 {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .task-info p {
            font-size: 12px;
            color: #d4af37;
        }

        .claim-btn {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
        }

        .claim-btn:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }

        /* لژنا خوارێ (Navigation Bar) */
        .nav-bar {
            display: flex;
            justify-content: space-around;
            background-color: #121621;
            border-top: 1px solid #2a3447;
            padding: 10px 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #8b9bb4;
            font-size: 12px;
            text-decoration: none;
            gap: 4px;
            cursor: pointer;
        }

        .nav-item.active {
            color: #d4af37;
        }

        .nav-item span.icon {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- سەرێ یاریێ -->
        <div class="header">
            <div class="user-level">
                <span>🦊</span>
                <div>
                    <div style="font-size: 12px; font-weight: bold;">MALAGA 🇪🇸</div>
                    <div style="font-size: 10px; color: #d4af37;">Lvl 1</div>
                </div>
            </div>
            <div class="coin-balance">
                🟡 <span id="score">0.0000</span> <span style="color: #2ecc71;">FOX</span>
            </div>
        </div>

        <!-- 1. پەڕەیا تاپ (Tap Screen) -->
        <div id="tapScreen" class="screen main-content active">
            <div class="big-coin-btn" id="tapBtn">
                <img src="coin.png" alt="FOX Coin" style="width: 100%; height: 100%; object-fit: cover;">
            </div>

            <div class="info-card">
                <div class="info-row">
                    <span>📦 پەکێت:</span>
                    <span style="font-weight: bold;">4/5</span>
                </div>
                <div class="info-row" style="color: #8b9bb4; font-size: 12px;">
                    <span>پەکیتا داهاتی:</span>
                    <span>04:48:00</span>
                </div>
                <hr style="border: 0; border-top: 1px solid #2a3447;">
                <div class="info-row">
                    <span>⚡ ئینرجی:</span>
                    <span style="font-weight: bold;">494 / 500</span>
                </div>
                <button class="action-btn">⚡ بەکاربینە (Use)</button>
            </div>
        </div>

        <!-- 2. پەڕەیا تاڕکان (Tasks Screen) -->
        <div id="tasksScreen" class="screen">
            <h3 style="margin-bottom: 15px; color: #d4af37;">ئەرکێن ڕۆژانە (Tasks)</h3>
            
            <div class="task-item">
                <div class="task-info">
                    <h4>جۆینی چەناڵا تێلێگرامێ بکه</h4>
                    <p>+0.001 FOX</p>
                </div>
                <button class="claim-btn" id="taskBtn" onclick="completeTask()">جۆین بکە</button>
            </div>
        </div>

        <!-- پەڕەیێن دی (Shop و Ads - بۆ نموونە) -->
        <div id="shopScreen" class="screen" style="justify-content: center; align-items: center;">
            <h3>🛒 دووکان (بزحف زوو دێ هێت)</h3>
        </div>
        <div id="adsScreen" class="screen" style="justify-content: center; align-items: center;">
            <h3>🎬 ڕیکلام (بزحف زوو دێ هێت)</h3>
        </div>

        <!-- لژنا خوارێ (Navigation Bar) -->
        <div class="nav-bar">
            <a onclick="switchTab('tapScreen', event)" class="nav-item active" id="navTap">
                <span class="icon">👆</span>
                <span>Tap</span>
            </a>
            <a onclick="switchTab('shopScreen', event)" class="nav-item" id="navShop">
                <span class="icon">🛒</span>
                <span>Shop</span>
            </a>
            <a onclick="switchTab('adsScreen', event)" class="nav-item" id="navAds">
                <span class="icon">🎬</span>
                <span>Ads</span>
            </a>
            <a onclick="switchTab('tasksScreen', event)" class="nav-item" id="navTasks">
                <span class="icon">📋</span>
                <span>Tasks</span>
            </a>
        </div>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        const tg = window.Telegram.WebApp;
        tg.expand();

        let coins = 0.0000;
        const scoreElement = document.getElementById('score');
        const tapBtn = document.getElementById('tapBtn');
        let taskDone = false;

        // لێدانا کۆینان ب کلیککرنێ
        tapBtn.addEventListener('click', function() {
            coins += 0.0001;
            scoreElement.innerText = coins.toFixed(4);

            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        });

        // گوهۆڕینا پەڕەیان (Tabs)
        function switchTab(screenId, event) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById(screenId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // جێبەجێکرنا تەسکی چەناڵێ
        function completeTask() {
            if (!taskDone) {
                // ڤەکردنا چەناڵا تە ل تێلێگرامێ یان براوزەری
                window.open('https://t.me/TORSEII', '_blank');

                // زێدەکرنا 0.001 بۆ سەر کۆینان
                coins += 0.0010;
                scoreElement.innerText = coins.toFixed(4);
                
                taskDone = true;
                const btn = document.getElementById('taskBtn');
                btn.innerText = 'وەرگرتن ✔';
                btn.disabled = true;

                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            }
        }
    </script>
</body>
</html>
