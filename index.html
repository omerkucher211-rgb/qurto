<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FOX Coin Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 800px;
            background-color: #0b0f19;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            border: 2px solid #222;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
        }

        .user-level {
            background-color: rgba(20, 25, 35, 0.9);
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .coin-balance {
            background-color: rgba(20, 25, 35, 0.9);
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 6px 12px;
            font-size: 14px;
            color: #d4af37;
            font-weight: bold;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            width: 100%;
        }

        .screen.active {
            display: flex;
        }

        .main-content {
            justify-content: center;
            gap: 20px;
            position: relative;
        }

        .big-coin-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, #222 30%, #000 90%);
            border: 4px solid #d4af37;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
            transition: transform 0.1s;
            overflow: hidden;
            position: relative;
        }

        .big-coin-btn:active {
            transform: scale(0.95);
        }

        /* ستافێ نیشانا پوینتا ل دەمێ تەپکرنێ */
        .floating-score {
            position: absolute;
            color: #d4af37;
            font-weight: bold;
            font-size: 20px;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
            background: rgba(11, 15, 25, 0.85);
            border: 2px solid #d4af37;
            padding: 4px 10px;
            border-radius: 10px;
            z-index: 100;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(0.8);
            }
            100% {
                opacity: 0;
                transform: translateY(-80px) scale(1.1);
            }
        }

        .info-card {
            background-color: rgba(18, 22, 33, 0.85);
            border: 1px solid #2a3447;
            border-radius: 15px;
            width: 100%;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            direction: rtl;
        }

        .action-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            outline: none;
            -webkit-appearance: none;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .task-item {
            background-color: rgba(18, 22, 33, 0.9);
            border: 1px solid #2a3447;
            border-radius: 12px;
            width: 100%;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .task-info h4 {
            font-size: 14px;
            margin-bottom: 4px;
            color: #fff;
        }

        .task-info p {
            font-size: 12px;
            color: #d4af37;
        }

        .claim-btn {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            outline: none;
        }

        .claim-btn:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }

        .nav-bar {
            display: flex;
            justify-content: space-around;
            background-color: #121621;
            border-top: 1px solid #2a3447;
            padding: 10px 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #8b9bb4;
            font-size: 12px;
            text-decoration: none;
            gap: 4px;
            cursor: pointer;
            flex: 1;
            outline: none;
            background: none;
            border: none;
        }

        .nav-item.active {
            color: #d4af37;
        }

        .nav-item span.icon {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- سەرێ یاریێ -->
        <div class="header">
            <div class="coin-balance">
                🟡 FOX <span id="score">0.0000</span>
            </div>
            <div class="user-level">
                <div style="text-align: right;">
                    <div style="font-size: 12px; font-weight: bold;">MALAGA 🇪🇸</div>
                    <div style="font-size: 10px; color: #d4af37;" id="levelText">Lvl 1</div>
                </div>
                <span>🦊</span>
            </div>
        </div>

        <!-- 1. پەڕەیا تاپ -->
        <div id="tapScreen" class="screen main-content active">
            <div class="big-coin-btn" id="tapBtn">
                <img src="coin.jpg" alt="FOX Coin" style="width: 100%; height: 100%; object-fit: cover; pointer-events: none;">
            </div>

            <div class="info-card">
                <div class="info-row">
                    <span>پەکێت 📦</span>
                    <span id="packetText" style="font-weight: bold; direction: ltr;">4 / 5</span>
                </div>
                <div class="info-row" style="color: #8b9bb4; font-size: 12px;">
                    <span>پەکیتا داهاتی</span>
                    <span id="timerText" style="direction: ltr;">04:48:00</span>
                </div>
                <hr style="border: 0; border-top: 1px solid #2a3447;">
                <div class="info-row">
                    <span>ئینرجی ⚡</span>
                    <span style="font-weight: bold; direction: ltr;" id="energyText">500 / 500</span>
                </div>
                <button class="action-btn" id="useEnergyBtn" onclick="usePacket()">بکاربینە (Use) ⚡</button>
            </div>
        </div>

        <!-- 2. پەڕەیا شوپ -->
        <div id="shopScreen" class="screen" style="justify-content: center; align-items: center;">
            <h3 style="color: #d4af37;">🛒 دووکان</h3>
        </div>

        <!-- 3. پەڕەیا ئەرکان -->
        <div id="tasksScreen" class="screen">
            <h3 style="margin-bottom: 15px; color: #d4af37;">ئەرکێن ڕۆژانە (Tasks)</h3>
            
            <div class="task-item">
                <button class="claim-btn" id="taskBtn" onclick="handleTask()">جۆین بکە</button>
                <div class="task-info" style="text-align: right;">
                    <h4>جۆینی کەناڵێ تێلێگرامێ بکە</h4>
                    <p>+0.001 FOX</p>
                </div>
            </div>
        </div>

        <!-- لژنا خوارێ -->
        <div class="nav-bar">
            <button onclick="switchTab('tasksScreen', event)" class="nav-item" id="navTasks">
                <span class="icon">📋</span>
                <span>Tasks</span>
            </button>
            <button onclick="switchTab('shopScreen', event)" class="nav-item" id="navShop">
                <span class="icon">🛒</span>
                <span>Shop</span>
            </button>
            <button onclick="switchTab('tapScreen', event)" class="nav-item active" id="navTap">
                <span class="icon">👆</span>
                <span>Tap</span>
            </button>
        </div>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        const tg = window.Telegram.WebApp;
        tg.expand();

        let telegramUserId = (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) ? tg.initDataUnsafe.user.id : null;
        if (!telegramUserId) {
            telegramUserId = localStorage.getItem('fox_random_device_id');
            if (!telegramUserId) {
                telegramUserId = 'dev_' + Math.random().toString(36).substring(2);
                localStorage.setItem('fox_random_device_id', telegramUserId);
            }
        }

        const STORAGE_PREFIX = 'fox_unique_game_' + telegramUserId + '_';

        let coins = parseFloat(localStorage.getItem(STORAGE_PREFIX + 'coins') || 0);
        let energy = parseInt(localStorage.getItem(STORAGE_PREFIX + 'energy') ?? 500);
        let level = parseInt(localStorage.getItem(STORAGE_PREFIX + 'level') || 1);
        let totalTaps = parseInt(localStorage.getItem(STORAGE_PREFIX + 'total_taps') || 0);
        let packets = localStorage.getItem(STORAGE_PREFIX + 'packets') !== null ? parseInt(localStorage.getItem(STORAGE_PREFIX + 'packets')) : 4;
        let totalSeconds = localStorage.getItem(STORAGE_PREFIX + 'timer') ? parseInt(localStorage.getItem(STORAGE_PREFIX + 'timer')) : (4 * 3600 + 48 * 60);
        let isTimerRunning = false;
        let taskState = localStorage.getItem(STORAGE_PREFIX + 'task_state') || 'join';

        const scoreElement = document.getElementById('score');
        const levelText = document.getElementById('levelText');
        const tapBtn = document.getElementById('tapBtn');
        const taskBtn = document.getElementById('taskBtn');
        const energyText = document.getElementById('energyText');
        const timerText = document.getElementById('timerText');
        const packetText = document.getElementById('packetText');

        scoreElement.innerText = coins.toFixed(4);
        levelText.innerText = "Lvl " + level;
        energyText.innerText = energy + " / 500";
        packetText.innerText = packets + " / 5";

        if (taskState === 'checking') {
            taskBtn.innerText = 'چاوەڕێ بکە...';
            taskBtn.disabled = true;
        } else if (taskState === 'claimed') {
            taskBtn.innerText = 'وەرگرتن ✔';
            taskBtn.disabled = true;
        }

        function startTimer() {
            if (isTimerRunning) return;
            isTimerRunning = true;

            let timerInterval = setInterval(function() {
                if (totalSeconds > 0) {
                    totalSeconds--;
                    let hours = Math.floor(totalSeconds / 3600);
                    let minutes = Math.floor((totalSeconds % 3600) / 60);
                    let seconds = totalSeconds % 60;

                    timerText.innerText = 
                        String(hours).padStart(2, '0') + ":" + 
                        String(minutes).padStart(2, '0') + ":" + 
                        String(seconds).padStart(2, '0');

                    localStorage.setItem(STORAGE_PREFIX + 'timer', totalSeconds);
                } else {
                    packets = 5;
                    packetText.innerText = packets + " / 5";
                    localStorage.setItem(STORAGE_PREFIX + 'packets', packets);
                    localStorage.removeItem(STORAGE_PREFIX + 'timer');
                    isTimerRunning = false;
                    clearInterval(timerInterval);
                }
            }, 1000);
        }

        if (packets < 5) {
            startTimer();
        }

        // Tap لیدان + نیشاندانا ژمارەی بلندا دەمێ تاپکرنێ (+ پوینت)
        tapBtn.addEventListener('click', function(e) {
            if (energy > 0) {
                energy -= 1;
                totalTaps += 1;

                let clickReward = 0.0001 * Math.pow(2, level - 1);
                coins += clickReward;

                let newLevel = Math.floor(totalTaps / 10) + 1;
                if (newLevel !== level) {
                    level = newLevel;
                    levelText.innerText = "Lvl " + level;
                    localStorage.setItem(STORAGE_PREFIX + 'level', level);
                }

                scoreElement.innerText = coins.toFixed(4);
                energyText.innerText = energy + " / 500";

                localStorage.setItem(STORAGE_PREFIX + 'coins', coins);
                localStorage.setItem(STORAGE_PREFIX + 'energy', energy);
                localStorage.setItem(STORAGE_PREFIX + 'total_taps', totalTaps);

                // دروستکرنا کاریگەرییا نیشاندانا ژمارەی ل جهێ پەنجەی
                const rect = tapBtn.getBoundingClientRect();
                const x = e.clientX ? e.clientX - rect.left : rect.width / 2;
                const y = e.clientY ? e.clientY - rect.top : rect.height / 2;

                const floatingEl = document.createElement('div');
                floatingEl.className = 'floating-score';
                // نیشاندانا کوینا زێدەبووی ب فرماتا دروست
                let displayReward = clickReward < 0.0001 ? "+" + clickReward.toFixed(6) : "+" + clickReward.toFixed(4);
                floatingEl.innerText = displayReward;
                floatingEl.style.left = (x - 25) + 'px';
                floatingEl.style.top = (y - 25) + 'px';

                tapBtn.appendChild(floatingEl);

                setTimeout(() => {
                    floatingEl.remove();
                }, 800);

                if (tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('medium');
                }
            } else {
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('error');
                }
            }
        });

        // ڤەکرنا پەکێتی (Use)
        function usePacket() {
            if (packets > 0) {
                packets -= 1; 
                packetText.innerText = packets + " / 5";
                localStorage.setItem(STORAGE_PREFIX + 'packets', packets);

                energy = 500; 
                energyText.innerText = energy + " / 500";
                localStorage.setItem(STORAGE_PREFIX + 'energy', energy);

                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }

                if (!isTimerRunning) {
                    totalSeconds = (4 * 3600 + 48 * 60);
                    startTimer();
                }
            } else {
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('error');
                }
            }
        }

        function switchTab(screenId, event) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById(screenId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // سیستەمێ ئەرکی (20 چرکە)
        function handleTask() {
            if (taskState === 'join') {
                window.open('https://t.me/TORSEII', '_blank');
                
                taskState = 'checking';
                localStorage.setItem(STORAGE_PREFIX + 'task_state', 'checking');
                
                taskBtn.innerText = 'چاوەڕێ بکە (20)...';
                taskBtn.disabled = true;

                let countdown = 20;
                let checkInterval = setInterval(function() {
                    countdown--;
                    if (countdown > 0) {
                        taskBtn.innerText = 'چاوەڕێ بکە (' + countdown + ')...';
                    } else {
                        clearInterval(checkInterval);
                        taskState = 'ready';
                        localStorage.setItem(STORAGE_PREFIX + 'task_state', 'ready');
                        taskBtn.innerText = 'پشکنین و وەرگرتن 🎁';
                        taskBtn.disabled = false;
                    }
                }, 1000);

            } else if (taskState === 'ready') {
                coins += 0.0010;
                scoreElement.innerText = coins.toFixed(4);
                localStorage.setItem(STORAGE_PREFIX + 'coins', coins);

                taskState = 'claimed';
                localStorage.setItem(STORAGE_PREFIX + 'task_state', 'claimed');

                taskBtn.innerText = 'وەرگرتن ✔';
                taskBtn.disabled = true;

                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            }
        }
    </script>
</body>
</html>
