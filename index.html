<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOX Coin Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .game-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 800px;
            background-color: #0b0f19;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            border: 2px solid #222;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
        }

        .user-level {
            background-color: rgba(20, 25, 35, 0.9);
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .coin-balance {
            background-color: rgba(20, 25, 35, 0.9);
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 6px 12px;
            font-size: 14px;
            color: #d4af37;
            font-weight: bold;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            width: 100%;
        }

        .screen.active {
            display: flex;
        }

        .main-content {
            justify-content: center;
            gap: 20px;
        }

        .big-coin-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, #222 30%, #000 90%);
            border: 4px solid #d4af37;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
            transition: transform 0.1s;
            user-select: none;
            overflow: hidden;
        }

        .big-coin-btn:active {
            transform: scale(0.95);
        }

        .info-card {
            background-color: rgba(18, 22, 33, 0.85);
            border: 1px solid #2a3447;
            border-radius: 15px;
            width: 100%;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .action-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .action-btn:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }

        .task-item {
            background-color: rgba(18, 22, 33, 0.9);
            border: 1px solid #2a3447;
            border-radius: 12px;
            width: 100%;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .task-info h4 {
            font-size: 14px;
            margin-bottom: 4px;
            color: #fff;
        }

        .task-info p {
            font-size: 12px;
            color: #d4af37;
        }

        .claim-btn {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
        }

        .claim-btn:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }

        .nav-bar {
            display: flex;
            justify-content: space-around;
            background-color: #121621;
            border-top: 1px solid #2a3447;
            padding: 10px 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #8b9bb4;
            font-size: 12px;
            text-decoration: none;
            gap: 4px;
            cursor: pointer;
            flex: 1;
        }

        .nav-item.active {
            color: #d4af37;
        }

        .nav-item span.icon {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- سەرێ یاریێ -->
        <div class="header">
            <div class="user-level">
                <span>🦊</span>
                <div style="text-align: right;">
                    <div style="font-size: 12px; font-weight: bold;">MALAGA 🇪🇸</div>
                    <div style="font-size: 10px; color: #d4af37;">Lvl 1</div>
                </div>
            </div>
            <div class="coin-balance">
                🟡 FOX <span id="score">0.0000</span>
            </div>
        </div>

        <!-- 1. پەڕەیا تاپ (Tap Screen) -->
        <div id="tapScreen" class="screen main-content active">
            <div class="big-coin-btn" id="tapBtn">
                <img src="coin.jpg" alt="FOX Coin" style="width: 100%; height: 100%; object-fit: cover;">
            </div>

            <div class="info-card">
                <div class="info-row">
                    <span id="packetText" style="font-weight: bold;">4 / 5</span>
                    <span>:پەکێت 📦</span>
                </div>
                <div class="info-row" style="color: #8b9bb4; font-size: 12px;">
                    <span id="timerText">04:48:00</span>
                    <span>:پەکیتا داهاتی</span>
                </div>
                <hr style="border: 0; border-top: 1px solid #2a3447;">
                <div class="info-row">
                    <span style="font-weight: bold;" id="energyText">500 / 500</span>
                    <span>:ئینرجی ⚡</span>
                </div>
                <button class="action-btn" id="useEnergyBtn" onclick="refillEnergy()">بەکاربینە (Use) ⚡</button>
            </div>
        </div>

        <!-- 2. پەڕەیا شوپ -->
        <div id="shopScreen" class="screen" style="justify-content: center; align-items: center;">
            <h3 style="color: #d4af37;">🛒 دووکان</h3>
        </div>

        <!-- 3. پەڕەیا ڕیکلام -->
        <div id="adsScreen" class="screen" style="justify-content: center; align-items: center;">
            <h3 style="color: #d4af37;">🎬 ڕیکلام</h3>
        </div>

        <!-- 4. پەڕەیا ئەرکان -->
        <div id="tasksScreen" class="screen">
            <h3 style="margin-bottom: 15px; color: #d4af37;">ئەرکێن ڕۆژانە (Tasks)</h3>
            
            <div class="task-item">
                <button class="claim-btn" id="taskBtn" onclick="completeTask()">جۆین بکە</button>
                <div class="task-info" style="text-align: right;">
                    <h4>جۆینی چەناڵا تێلێگرامێ بکە</h4>
                    <p>+0.001 FOX</p>
                </div>
            </div>
        </div>

        <!-- لژنا خوارێ -->
        <div class="nav-bar">
            <a onclick="switchTab('tasksScreen', event)" class="nav-item" id="navTasks">
                <span class="icon">📋</span>
                <span>Tasks</span>
            </a>
            <a onclick="switchTab('adsScreen', event)" class="nav-item" id="navAds">
                <span class="icon">🎬</span>
                <span>Ads</span>
            </a>
            <a onclick="switchTab('shopScreen', event)" class="nav-item" id="navShop">
                <span class="icon">🛒</span>
                <span>Shop</span>
            </a>
            <a onclick="switchTab('tapScreen', event)" class="nav-item active" id="navTap">
                <span class="icon">👆</span>
                <span>Tap</span>
            </a>
        </div>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        const tg = window.Telegram.WebApp;
        tg.expand();

        // سەیڤکرنا دوو قاتی (بۆ هەمی براوزەران)
        const getStorage = () => (typeof(Storage) !== "undefined" ? localStorage : sessionStorage);
        const foxStorage = getStorage();

        let savedCoins = foxStorage.getItem('fox_coins');
        let coins = savedCoins !== null ? parseFloat(savedCoins) : 0.0000;
        
        let savedEnergy = foxStorage.getItem('fox_energy');
        let energy = savedEnergy !== null ? parseInt(savedEnergy) : 500;

        // سیستەمێ پەکێتان (4 مایی)
        let packets = foxStorage.getItem('fox_packets') ? parseInt(foxStorage.getItem('fox_packets')) : 4;
        let totalSeconds = foxStorage.getItem('fox_timer') ? parseInt(foxStorage.getItem('fox_timer')) : (4 * 3600 + 48 * 60);
        let isTimerRunning = false;

        let taskDone = (foxStorage.getItem('fox_task_done') === 'true');

        const scoreElement = document.getElementById('score');
        const tapBtn = document.getElementById('tapBtn');
        const taskBtn = document.getElementById('taskBtn');
        const energyText = document.getElementById('energyText');
        const timerText = document.getElementById('timerText');
        const packetText = document.getElementById('packetText');
        const useEnergyBtn = document.getElementById('useEnergyBtn');

        scoreElement.innerText = coins.toFixed(4);
        energyText.innerText = energy + " / 500";
        packetText.innerText = packets + " / 5";

        if (taskDone) {
            taskBtn.innerText = 'وەرگرتن ✔';
            taskBtn.disabled = true;
        }

        // 1. کارپێکرنا دەمژمێرێ بێ راوستان
        function startTimer() {
            if (isTimerRunning) return;
            isTimerRunning = true;

            let timerInterval = setInterval(function() {
                if (totalSeconds > 0) {
                    totalSeconds--;
                    let hours = Math.floor(totalSeconds / 3600);
                    let minutes = Math.floor((totalSeconds % 3600) / 60);
                    let seconds = totalSeconds % 60;

                    timerText.innerText = 
                        String(hours).padStart(2, '0') + ":" + 
                        String(minutes).padStart(2, '0') + ":" + 
                        String(seconds).padStart(2, '0');

                    foxStorage.setItem('fox_timer', totalSeconds);
                } else {
                    // دەما دەم ب دوماهی هات، 5 پەکێتان ڤەدگەڕینە و دەست ب هژمارتنێ ناکەین هەتا USE نەکەن
                    packets = 5;
                    packetText.innerText = packets + " / 5";
                    foxStorage.setItem('fox_packets', packets);
                    foxStorage.removeItem('fox_timer');
                    isTimerRunning = false;
                    clearInterval(timerInterval);
                }
            }, 1000);
        }

        // دەستپێکرنا دەمژمێرێ ل دەستپێکێ
        if (packets < 5) {
            startTimer();
        }

        // 2. کلیککرنا ل سەر کۆینی (Tap) و کێمکرنا ئینرجیی
        tapBtn.addEventListener('click', function() {
            if (energy > 0) {
                energy -= 1;
                coins += 0.0001;

                scoreElement.innerText = coins.toFixed(4);
                energyText.innerText = energy + " / 500";

                foxStorage.setItem('fox_coins', coins);
                foxStorage.setItem('fox_energy', energy);

                if (tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('medium');
                }
            } else {
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('error');
                }
            }
        });

        // 3. ڤەگەراندنا ئینرجیی و کێمکرنا پەکێتان (USE Packet)
        function refillEnergy() {
            if (energy < 500 && packets > 0) {
                // کێمکرنا پەکێتەکێ
                packets -= 1;
                packetText.innerText = packets + " / 5";
                foxStorage.setItem('fox_packets', packets);

                // ڤەگەراندنا ئینرجیی بۆ 500
                energy = 500;
                energyText.innerText = energy + " / 500";
                foxStorage.setItem('fox_energy', energy);

                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }

                // ئەگەر دەمژمێر نەبوو، دەست پێ بکە
                if (packets === 4 && !isTimerRunning) {
                    totalSeconds = (4 * 3600 + 48 * 60); // 4h 48m
                    startTimer();
