<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hez Coin Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .game-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 800px;
            background-color: #0b0f19;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            border: 2px solid #222;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
        }

        .user-level {
            background-color: rgba(20, 25, 35, 0.9);
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .coin-balance {
            background-color: rgba(20, 25, 35, 0.9);
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 6px 12px;
            font-size: 14px;
            color: #d4af37;
            font-weight: bold;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 20px;
            padding: 20px;
        }

        .big-coin-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, #222 30%, #000 90%);
            border: 4px solid #d4af37;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
            transition: transform 0.1s;
        }

        .big-coin-btn:active {
            transform: scale(0.95);
        }

        .big-coin-btn span {
            font-size: 60px;
        }

        .info-card {
            background-color: rgba(18, 22, 33, 0.85);
            border: 1px solid #2a3447;
            border-radius: 15px;
            width: 100%;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .action-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .nav-bar {
            display: flex;
            justify-content: space-around;
            background-color: #121621;
            border-top: 1px solid #2a3447;
            padding: 10px 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #8b9bb4;
            font-size: 12px;
            text-decoration: none;
            gap: 4px;
        }

        .nav-item.active {
            color: #d4af37;
        }

        .nav-item span.icon {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <div class="user-level">
                <span>💪</span>
                <div>
                    <div style="font-size: 12px; font-weight: bold;">MALAGA 🇪🇸</div>
                    <div style="font-size: 10px; color: #d4af37;">Lvl 1</div>
                </div>
            </div>
            <div class="coin-balance">
                🟡 0.000006 <span style="color: #2ecc71;">HEZ</span>
            </div>
        </div>

        <div class="main-content">
            <div class="big-coin-btn" id="tapBtn">
                <span>💪</span>
            </div>

            <div class="info-card">
                <div class="info-row">
                    <span>📦 پەکێت:</span>
                    <span style="font-weight: bold;">4/5</span>
                </div>
                <div class="info-row" style="color: #8b9bb4; font-size: 12px;">
                    <span>پەکیتا داهاتی:</span>
                    <span>04:48:00</span>
                </div>
                <hr style="border: 0; border-top: 1px solid #2a3447;">
                <div class="info-row">
                    <span>⚡ ئینرجی:</span>
                    <span style="font-weight: bold;">494 / 500</span>
                </div>
                <button class="action-btn">⚡ بەکاربینە (Use)</button>
            </div>
        </div>

        <div class="nav-bar">
            <a href="#" class="nav-item active">
                <span class="icon">👆</span>
                <span>Tap</span>
            </a>
            <a href="#" class="nav-item">
                <span class="icon">🛒</span>
                <span>Shop</span>
            </a>
            <a href="#" class="nav-item">
                <span class="icon">🎬</span>
                <span>Ads</span>
            </a>
            <a href="#" class="nav-item">
                <span class="icon">📋</span>
                <span>Tasks</span>
            </a>
        </div>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        const tg = window.Telegram.WebApp;
        tg.expand();

        document.getElementById('tapBtn').addEventListener('click', function() {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        });
    </script>
</body>
</html>
