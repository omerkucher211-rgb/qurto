<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FOX Coin Game - Auth System</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 800px;
            background-color: #0b0f19;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            width: 100%;
            justify-content: center;
        }

        .screen.active { display: flex; }

        /* Auth Styles */
        .auth-box {
            background-color: rgba(18, 22, 33, 0.95);
            border: 1.5px solid #d4af37;
            border-radius: 16px;
            width: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        .auth-box h2 {
            color: #d4af37;
            text-align: center;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .auth-input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #2a3447;
            background-color: rgba(11, 15, 25, 0.9);
            color: #fff;
            font-size: 13px;
            text-align: right;
            outline: none;
        }

        .auth-input:focus {
            border-color: #d4af37;
        }

        .auth-btn {
            background-color: #d4af37;
            color: #0b0f19;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }

        .auth-btn:active { transform: scale(0.98); }

        .auth-switch {
            text-align: center;
            font-size: 12px;
            color: #8b9bb4;
            cursor: pointer;
            margin-top: 5px;
        }

        .auth-switch span {
            color: #d4af37;
            text-decoration: underline;
        }

        /* Game UI */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            gap: 6px;
            z-index: 10;
        }

        .coin-balance {
            background-color: rgba(20, 25, 35, 0.9);
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 5px 10px;
            font-size: 13px;
            color: #d4af37;
            font-weight: bold;
        }

        .user-level {
            background-color: rgba(20, 25, 35, 0.9);
            border: 2px solid #ff4500;
            border-radius: 12px;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lion-avatar-wrapper {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #fff;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-content {
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .big-coin-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, #333 30%, #111 90%);
            border: 4px solid #d4af37;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
            position: relative;
        }

        .big-coin-btn span { font-size: 65px; pointer-events: none; }

        .floating-score {
            position: absolute;
            color: #ffd700;
            font-weight: bold;
            font-size: 13px;
            pointer-events: none;
            animation: floatUp 0.7s ease-out forwards;
            background: rgba(18, 22, 33, 0.9);
            border: 1.5px solid #d4af37;
            padding: 4px 10px;
            border-radius: 9px;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.5); }
            100% { opacity: 0; transform: translateY(-75px) scale(0.95); }
        }

        .info-card {
            background-color: rgba(18, 22, 33, 0.95);
            border: 1px solid #2a3447;
            border-radius: 14px;
            width: 100%;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .action-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .logout-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .nav-bar {
            display: flex;
            justify-content: space-around;
            background-color: #121621;
            border-top: 1px solid #2a3447;
            padding: 8px 0;
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #8b9bb4;
            font-size: 11px;
            background: none;
            border: none;
            cursor: pointer;
            flex: 1;
        }

        .nav-item.active { color: #d4af37; }
        .nav-item span.icon { font-size: 15px; }
    </style>
</head>
<body>

    <div class="game-container">

        <!-- 1. REGISTER SCREEN -->
        <div id="registerScreen" class="screen active">
            <div class="auth-box">
                <h2>👤 تۆمارکرنا ئەکاونتی (Register)</h2>
                <input type="text" id="regUsername" class="auth-input" placeholder="ناڤێ بەکارهێنەری (Username)">
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="regPassword" class="auth-input" placeholder="پاسوورد (Password)">
                    <button type="button" onclick="generateRandomPassword()" style="background: #3498db; border: none; color: #fff; border-radius: 8px; padding: 0 10px; font-size: 11px; cursor: pointer; white-space: nowrap;" title="پاسووردا Random">Random 🎲</button>
                </div>
                <button class="auth-btn" onclick="registerUser()">تۆمارکرن (Sign Up)</button>
                <div class="auth-switch" onclick="switchAuthScreen('loginScreen')">تە پێشتر ئەکاونت هەیە؟ <span>چوونە ژوورڤە (Login)</span></div>
            </div>
        </div>

        <!-- 2. LOGIN SCREEN -->
        <div id="loginScreen" class="screen">
            <div class="auth-box">
                <h2>🔐 چوونە ژوورڤە (Login)</h2>
                <input type="text" id="loginUsername" class="auth-input" placeholder="ناڤێ بەکارهێنەری (Username)">
                <input type="password" id="loginPassword" class="auth-input" placeholder="پاسوورد (Password)">
                <button class="auth-btn" onclick="loginUser()">چوونە ژوورڤە (Sign In)</button>
                <div class="auth-switch" onclick="switchAuthScreen('registerScreen')">تە ئەکاونت نینە؟ <span>تۆمارکرنا نوو (Register)</span></div>
            </div>
        </div>

        <!-- 3. MAIN GAME SCREEN -->
        <div id="gameScreen" class="screen" style="padding: 0; justify-content: space-between;">
            <!-- Header -->
            <div class="header" style="width: 100%;">
                <div class="coin-balance">
                    🟡 <span id="score">0.00000</span>
                </div>
                <button class="logout-btn" onclick="logoutUser()">دەرکەڤت (Logout)</button>
                <div class="user-level" id="profileHeaderBtn">
                    <div style="text-align: right;">
                        <div style="font-size: 10px; font-weight: bold; color: #ffae42;" id="userNameText">FOX Player</div>
                        <div style="font-size: 8px; color: #d4af37;" id="levelText">Lvl 1 🦁</div>
                    </div>
                    <div class="lion-avatar-wrapper">
                        <span style="font-size: 12px;">🦁</span>
                    </div>
                </div>
            </div>

            <!-- Tap Content -->
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; width: 100%; padding: 12px;">
                <div class="big-coin-btn" id="tapBtn">
                    <span>🪙</span>
                </div>

                <div class="info-card" style="margin-top: 15px;">
                    <div class="info-row">
                        <span>ئینرجی ⚡</span>
                        <span style="font-weight: bold;" id="energyText">500 / 500</span>
                    </div>
                    <button class="action-btn" onclick="useEnergy()">بکاربینە (Use) ⚡</button>
                </div>
            </div>

            <!-- Navigation Bar -->
            <div class="nav-bar" style="width: 100%;">
                <button class="nav-item active">
                    <span class="icon">👆</span>
                    <span>Tap</span>
                </button>
            </div>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentUserKey = null;
        let coins = 0.0;
        let energy = 500;
        let maxEnergy = 500;
        let level = 1;

        // Check if user is already logged in during this session
        window.onload = function() {
            let activeUser = sessionStorage.getItem('fox_active_user');
            if (activeUser) {
                loadUserData(activeUser);
                showGameScreen();
            }
        };

        function switchAuthScreen(screenId) {
            document.getElementById('registerScreen').classList.remove('active');
            document.getElementById('loginScreen').classList.remove('active');
            document.getElementById(screenId).classList.add('active');
        }

        // Generate Random Password Function
        function generateRandomPassword() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$";
            let pass = "";
            for (let i = 0; i < 8; i++) {
                pass += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('regPassword').value = pass;
            alert("پاسووردا Random بۆ تە هاتە دروستکرن: " + pass + "\nتکایە لای خۆ سەیڤ بکە!");
        }

        function registerUser() {
            let username = document.getElementById('regUsername').value.trim();
            let password = document.getElementById('regPassword').value.trim();

            if (!username || !password) {
                alert('تکایە ناڤ و پاسووردی بنڤیسە! ❌');
                return;
            }

            let usersDB = JSON.parse(localStorage.getItem('fox_users_database') || '{}');

            if (usersDB[username]) {
                alert('ئەڤ ناڤە پێشتر هاتیە تۆمارکرن! تکایە ناڤەکێ دی هەلبژێرە. ❌');
                return;
            }

            // Save new user credentials and starting data
            usersDB[username] = {
                password: password,
                coins: 1.00000,
                energy: 500,
                maxEnergy: 500,
                level: 1
            };

            localStorage.setItem('fox_users_database', JSON.stringify(usersDB));
            alert('پیرۆزە! ئەکاونتا تە ب سەرکەڤتن هاتە دروستکرن. نوو دەرباز بە (Login). 🎉');
            switchAuthScreen('loginScreen');
        }

        function loginUser() {
            let username = document.getElementById('loginUsername').value.trim();
            let password = document.getElementById('loginPassword').value.trim();

            let usersDB = JSON.parse(localStorage.getItem('fox_users_database') || '{}');

            if (!usersDB[username] || usersDB[username].password !== password) {
                alert('ناڤێ بەکارهێنەری یان پاسوورد خەلەتە! ❌');
                return;
            }

            // Set active session
            sessionStorage.setItem('fox_active_user', username);
            loadUserData(username);
            showGameScreen();
        }

        function loadUserData(username) {
            currentUserKey = 'fox_user_data_' + username;
            let usersDB = JSON.parse(localStorage.getItem('fox_users_database') || '{}');
            let uData = usersDB[username] || {};

            // Load saved state or default
            coins = parseFloat(uData.coins || 1.0);
            energy = parseInt(uData.energy || 500);
            maxEnergy = parseInt(uData.maxEnergy || 500);
            level = parseInt(uData.level || 1);

            document.getElementById('userNameText').innerText = username;
            document.getElementById('score').innerText = coins.toFixed(5);
            document.getElementById('energyText').innerText = energy + " / " + maxEnergy;
            document.getElementById('levelText').innerText = "Lvl " + level + " 🦁";
        }

        function saveCurrentUserData() {
            if (!currentUserKey) return;
            let username = sessionStorage.getItem('fox_active_user');
            let usersDB = JSON.parse(localStorage.getItem('fox_users_database') || '{}');
            
            if (usersDB[username]) {
                usersDB[username].coins = coins;
                usersDB[username].energy = energy;
                usersDB[username].maxEnergy = maxEnergy;
                usersDB[username].level = level;
                localStorage.setItem('fox_users_database', JSON.stringify(usersDB));
            }
        }

        function showGameScreen() {
            document.getElementById('registerScreen').classList.remove('active');
            document.getElementById('loginScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');
        }

        function logoutUser() {
            saveCurrentUserData();
            sessionStorage.removeItem('fox_active_user');
            currentUserKey = null;
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('loginScreen').classList.add('active');
        }

        // Tap Game Logic
        const tapBtn = document.getElementById('tapBtn');
        
        function handleTapAction(e) {
            if (energy > 0) {
                energy -= 1;
                coins += 0.00001;

                document.getElementById('score').innerText = coins.toFixed(5);
                document.getElementById('energyText').innerText = energy + " / " + maxEnergy;
                saveCurrentUserData();

                const rect = tapBtn.getBoundingClientRect();
                let clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : rect.left + rect.width / 2);
                let clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : rect.top + rect.height / 2);

                const floatingEl = document.createElement('div');
                floatingEl.className = 'floating-score';
                floatingEl.innerHTML = `<span style="color:#2ecc71;">+0.00001</span>`;
                floatingEl.style.left = (clientX - rect.left - 20) + 'px';
                floatingEl.style.top = (clientY - rect.top - 20) + 'px';

                tapBtn.appendChild(floatingEl);
                setTimeout(() => floatingEl.remove(), 700);

                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            }
        }

        tapBtn.addEventListener('click', handleTapAction);
        tapBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            handleTapAction(e);
        }, { passive: false });

        function useEnergy() {
            energy = maxEnergy;
            document.getElementById('energyText').innerText = energy + " / " + maxEnergy;
            saveCurrentUserData();
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }
    </script>
</body>
</html>
